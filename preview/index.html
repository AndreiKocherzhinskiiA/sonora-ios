<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sonora iPhone Preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="device" aria-label="Sonora iPhone UI preview">
    <header class="status"><span>9:41</span><span>100%</span></header>
    <section id="screen" class="screen"></section>
    <aside id="player" class="mini-player" hidden></aside>
    <nav class="tabs" aria-label="Main navigation"></nav>
    <section id="nowPlaying" class="now-playing" aria-modal="true" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
