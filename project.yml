name: Sonora
options:
  bundleIdPrefix: org.sonorahq
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: Sonora
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
targets:
  Sonora:
    type: application
    platform: iOS
    sources:
      - path: Sonora
        excludes:
          - Resources/Icons/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sonorahq.sonora
        INFOPLIST_FILE: Sonora/Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
